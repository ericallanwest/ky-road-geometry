[project]
name = "ky-road-geometry"
version = "0.1.0"
description = "Road geometry from public lidar, and where friction matters: grade, curvature, cross slope and friction demand on Kentucky's public road network"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Eric West" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyproj>=3.6",
    "rasterio>=1.4",
    "requests>=2.31",
    "scipy>=1.13",
    "shapely>=2.1",
]

[project.scripts]
kyrg = "ky_road_geometry.cli:main"

[dependency-groups]
dev = [
    "altair>=6.3.0",
    "marimo>=0.25.2",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ky_road_geometry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
